substitutions:
  name: eaton-5px-nut
  friendly_name: Eaton 5PX NUT

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.10.0

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
ota:
  - platform: esphome

# USB host consumes the S3's native USB PHY on GPIO19/GPIO20.
# Keep logging on UART0 so it does not contend with USB_SERIAL_JTAG.
logger:
  hardware_uart: UART0

external_components:
  - source:
      type: local
      path: ../components
    components: [eaton_nut]

eaton_nut:
  ups_name: eaton
  username: !secret nut_username
  password: !secret nut_password
  description: Eaton 5PX 1500i RT2U G2
